services:
  # ==========================================================
  # MySQL 8.0 - Khởi tạo các Database riêng biệt cho từng service
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-rental_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rental_secret}
      MYSQL_DATABASE: auth_db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./docker/mysql/init/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./docker/mysql/init/03-notifications.sql:/docker-entrypoint-initdb.d/03-notifications.sql:ro
      - ./docker/mysql/init/04-workflow-resources.sql:/docker-entrypoint-initdb.d/04-workflow-resources.sql:ro
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental-network

  # ==========================================================
  # RabbitMQ Message Broker - Async Domain Events
  # ==========================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rental-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rental_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rental_rabbit_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"    # AMQP protocol
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"  # RabbitMQ Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental-network

networks:
  rental-network:
    name: rental-network
    driver: bridge

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-rental_mysql_data}
  rabbitmq_data:
    name: ${RABBITMQ_VOLUME_NAME:-rental_rabbitmq_data}
